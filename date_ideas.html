<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Date Ideas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.260.0/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'handwriting': ['Caveat', 'cursive'],
                        'sans': ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        romantic: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #fff1f2; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom scrollbar for textareas */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #ffe4e6; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #fda4af; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #fb7185; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

    
    <!-- Auth / Name Entry Screen -->
    <div id="auth-screen" class="flex-1 flex flex-col items-center justify-center p-4 fade-in">
        <div class="glass-card p-8 rounded-3xl shadow-xl max-w-md w-full text-center">
            <i data-lucide="heart" class="w-16 h-16 text-romantic-500 mx-auto mb-4 animate-pulse"></i>
            <h1 class="font-handwriting text-5xl text-romantic-600 mb-2">Our Date Ideas</h1>
            <p class="text-sm text-gray-500 mb-8">A special place for just the two of us.</p>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <input type="text" id="user-name" placeholder="What's your name?" required
                        class="w-full px-4 py-3 rounded-xl border border-romantic-200 focus:outline-none focus:ring-2 focus:ring-romantic-400 focus:border-transparent transition-all bg-white/50 text-center text-lg">
                </div>
                <button type="submit" 
                    class="w-full bg-romantic-500 hover:bg-romantic-600 text-white font-medium py-3 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2">
                    Enter <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
            
            <p class="text-xs text-gray-400 mt-6">
                Ready to be deployed on GitHub Pages. <br> Powered by Firebase.
            </p>
        </div>
    </div>

    <!-- Main App Screen (Hidden initially) -->
    <div id="app-screen" class="hidden flex-1 flex-col fade-in">
        <!-- Header -->
        <header class="bg-white/80 backdrop-blur-md border-b border-romantic-100 sticky top-0 z-10">
            <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i data-lucide="heart-handshake" class="w-8 h-8 text-romantic-500"></i>
                    <h1 class="font-handwriting text-3xl text-romantic-600 pt-1">Date Ideas</h1>
                </div>
                <div class="flex items-center gap-4">
                    <span id="welcome-message" class="text-sm font-medium text-gray-600 hidden sm:block"></span>
                    <button id="logout-btn" class="text-sm text-romantic-500 hover:text-romantic-600 transition-colors p-2 rounded-full hover:bg-romantic-50">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-4 py-8 w-full grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Add Idea Form Column -->
            <div class="md:col-span-1">
                <div class="glass-card p-6 rounded-3xl shadow-sm sticky top-24">
                    <h2 class="font-handwriting text-2xl text-romantic-600 mb-4 flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-5 h-5"></i> New Idea
                    </h2>
                    <form id="add-idea-form" class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Title</label>
                            <input type="text" id="idea-title" placeholder="e.g. Picnic at the park" required
                                class="w-full px-4 py-2 rounded-xl border border-romantic-100 focus:outline-none focus:ring-2 focus:ring-romantic-300 bg-white/70">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Description</label>
                            <textarea id="idea-description" placeholder="Let's bring some strawberries and a blanket..." required rows="3"
                                class="w-full px-4 py-2 rounded-xl border border-romantic-100 focus:outline-none focus:ring-2 focus:ring-romantic-300 bg-white/70 resize-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Proposed Date (Optional)</label>
                            <input type="date" id="idea-date"
                                class="w-full px-4 py-2 rounded-xl border border-romantic-100 focus:outline-none focus:ring-2 focus:ring-romantic-300 bg-white/70 text-gray-600">
                        </div>
                        <button type="submit" id="submit-idea-btn"
                            class="w-full bg-romantic-500 hover:bg-romantic-600 text-white font-medium py-2.5 rounded-xl shadow hover:shadow-md transition-all flex items-center justify-center gap-2">
                            <i data-lucide="plus" class="w-4 h-4"></i> Add Idea
                        </button>
                    </form>
                </div>
            </div>

            <!-- Ideas List Column -->
            <div class="md:col-span-2 space-y-4">
                <div class="flex items-center justify-between mb-2 px-2">
                    <h2 class="font-handwriting text-2xl text-gray-700">Our Adventures</h2>
                    <span id="idea-count" class="text-xs font-semibold bg-romantic-100 text-romantic-600 px-3 py-1 rounded-full">0 ideas</span>
                </div>
                
                <div id="ideas-container" class="space-y-4">
                    <!-- Ideas will be rendered here dynamically -->
                    <div class="text-center py-12 text-gray-400">
                        <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2 text-romantic-300"></i>
                        <p>Loading your beautiful ideas...</p>
                    </div>
                </div>
            </div>
            
        </main>
    </div>

    <!-- Modal for Messages -->
    <div id="message-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl transform scale-95 transition-transform duration-300" id="message-modal-content">
            <h3 id="message-title" class="text-lg font-semibold text-gray-800 mb-2">Notice</h3>
            <p id="message-text" class="text-gray-600 mb-6"></p>
            <button id="close-modal-btn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 rounded-xl transition-colors">
                Okay
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Configuration ---
        // If you deploy this to your own GitHub Pages, replace 'defaultConfig' with your own Firebase Project settings.
        const defaultConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Use environment injected config if available (for preview environment), else fallback
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultConfig;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'romantic-date-ideas';
        
        // Initialize Firebase
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (error) {
            console.error("Firebase initialization failed:", error);
            showModal("Setup Required", "Please configure your Firebase credentials in the code before deploying.");
        }

        // --- App State ---
        let currentUserId = null;
        let currentUserName = localStorage.getItem('dateAppUserName') || '';
        let ideasUnsubscribe = null;

        // --- DOM Elements ---
        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const loginForm = document.getElementById('login-form');
        const userNameInput = document.getElementById('user-name');
        const welcomeMessage = document.getElementById('welcome-message');
        const logoutBtn = document.getElementById('logout-btn');
        const addIdeaForm = document.getElementById('add-idea-form');
        const submitIdeaBtn = document.getElementById('submit-idea-btn');
        const ideasContainer = document.getElementById('ideas-container');
        const ideaCount = document.getElementById('idea-count');
        const messageModal = document.getElementById('message-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');

        // Initialize Lucide Icons
        lucide.createIcons();

        // --- Utility Functions ---
        function showModal(title, text) {
            document.getElementById('message-title').textContent = title;
            document.getElementById('message-text').textContent = text;
            messageModal.classList.remove('hidden');
            messageModal.classList.add('flex');
            // Tiny delay to allow display:flex to apply before animating opacity
            setTimeout(() => {
                messageModal.classList.remove('opacity-0');
                document.getElementById('message-modal-content').classList.remove('scale-95');
            }, 10);
        }

        closeModalBtn.addEventListener('click', () => {
            messageModal.classList.add('opacity-0');
            document.getElementById('message-modal-content').classList.add('scale-95');
            setTimeout(() => {
                messageModal.classList.add('hidden');
                messageModal.classList.remove('flex');
            }, 300);
        });

        function formatDate(dateString) {
            if (!dateString) return null;
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            const date = new Date(dateString);
            // Ensure timezone offset doesn't shift the selected date
            date.setMinutes(date.getMinutes() + date.getTimezoneOffset());
            return date.toLocaleDateString(undefined, options);
        }

        // --- STREAMING_CHUNK:Implementing Firebase logic for Authentication ---

        // Login Form Submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = userNameInput.value.trim();
            if (!name) return;

            currentUserName = name;
            localStorage.setItem('dateAppUserName', name);
            
            try {
                // Try to use environment token if available, otherwise anonymous
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
                showModal("Login Error", "Could not sign in. Check console for details.");
            }
        });

        logoutBtn.addEventListener('click', async () => {
            try {
                if(ideasUnsubscribe) ideasUnsubscribe();
                await signOut(auth);
                localStorage.removeItem('dateAppUserName');
                currentUserName = '';
                userNameInput.value = '';
            } catch (error) {
                console.error("Logout error:", error);
            }
        });

        // Listen for Auth State Changes
        onAuthStateChanged(auth, (user) => {
            if (user && currentUserName) {
                // User is signed in and has provided a name
                currentUserId = user.uid;
                showAppScreen();
                loadIdeas();
            } else {
                // User is signed out or hasn't provided a name yet
                currentUserId = null;
                showAuthScreen();
            }
        });

        function showAuthScreen() {
            authScreen.classList.remove('hidden');
            appScreen.classList.add('hidden');
            if(currentUserName) userNameInput.value = currentUserName;
        }

        function showAppScreen() {
            authScreen.classList.add('hidden');
            appScreen.classList.remove('hidden');
            appScreen.classList.add('flex');
            welcomeMessage.innerHTML = `Hi, <span class="text-romantic-500 font-semibold">${currentUserName}</span> <i data-lucide="sparkles" class="w-4 h-4 inline text-yellow-400"></i>`;
            lucide.createIcons();
        }

        // --- STREAMING_CHUNK:Implementing Firestore fetching and rendering ---

        // The path rule required for shared data in the immersive environment
        function getIdeasCollection() {
            return collection(db, 'artifacts', appId, 'public', 'data', 'dateIdeas');
        }

        // Add New Idea
        addIdeaForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUserId) return;

            const title = document.getElementById('idea-title').value.trim();
            const description = document.getElementById('idea-description').value.trim();
            const dateStr = document.getElementById('idea-date').value;

            if (!title || !description) {
                showModal("Incomplete", "Please fill in both title and description.");
                return;
            }

            const originalBtnHtml = submitIdeaBtn.innerHTML;
            submitIdeaBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Saving...`;
            submitIdeaBtn.disabled = true;
            lucide.createIcons();

            try {
                await addDoc(getIdeasCollection(), {
                    title: title,
                    description: description,
                    proposedDate: dateStr || null,
                    authorName: currentUserName,
                    authorId: currentUserId,
                    createdAt: Date.now() // Using client timestamp for easy local sorting without index requirements
                });
                
                // Reset form
                addIdeaForm.reset();
                showModal("Success!", "Your date idea was saved successfully.");
            } catch (error) {
                console.error("Error adding idea:", error);
                showModal("Error", "Failed to save the idea. Make sure Firebase rules allow writes.");
            } finally {
                submitIdeaBtn.innerHTML = originalBtnHtml;
                submitIdeaBtn.disabled = false;
                lucide.createIcons();
            }
        });

        // Delete Idea (Globally accessible to window for inline onclick)
        window.deleteIdea = async function(docId) {
            if (!currentUserId) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'dateIdeas', docId));
            } catch (error) {
                console.error("Error deleting idea:", error);
                showModal("Error", "Failed to delete the idea.");
            }
        };

        // Load Ideas Real-time
        function loadIdeas() {
            if (!currentUserId) return;

            // Fetching all documents in collection. Sorting in memory to obey environment rules.
            const q = query(getIdeasCollection());
            
            ideasUnsubscribe = onSnapshot(q, (snapshot) => {
                let ideas = [];
                snapshot.forEach((doc) => {
                    ideas.push({ id: doc.id, ...doc.data() });
                });

                // Sort descending by creation time in memory
                ideas.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                
                renderIdeas(ideas);
            }, (error) => {
                console.error("Error listening to ideas:", error);
                ideasContainer.innerHTML = `
                    <div class="text-center py-8 bg-red-50 rounded-2xl border border-red-100">
                        <p class="text-red-500">Failed to load ideas. Please check connection.</p>
                    </div>`;
            });
        }

        function renderIdeas(ideas) {
            ideaCount.textContent = `${ideas.length} idea${ideas.length !== 1 ? 's' : ''}`;
            
            if (ideas.length === 0) {
                ideasContainer.innerHTML = `
                    <div class="glass-card text-center py-16 rounded-3xl border-dashed border-2 border-romantic-200">
                        <i data-lucide="bird" class="w-12 h-12 text-romantic-300 mx-auto mb-3"></i>
                        <h3 class="text-lg font-medium text-gray-700">No ideas yet</h3>
                        <p class="text-sm text-gray-400 mt-1">Be the first to suggest a lovely date!</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            ideasContainer.innerHTML = ideas.map((idea) => {
                const formattedDate = formatDate(idea.proposedDate);
                const isMine = idea.authorId === currentUserId;
                
                // Color variations based on author name hash for a bit of playfulness
                const colors = ['bg-rose-50', 'bg-pink-50', 'bg-fuchsia-50', 'bg-red-50'];
                const colorClass = colors[(idea.authorName || "").length % colors.length];

                return `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:shadow-md transition-shadow relative overflow-hidden group">
                        <div class="absolute top-0 left-0 w-1 h-full ${isMine ? 'bg-romantic-400' : 'bg-fuchsia-300'}"></div>
                        
                        <div class="flex justify-between items-start mb-2 pl-3">
                            <h3 class="text-lg font-semibold text-gray-800">${idea.title}</h3>
                            ${isMine ? `
                                <button onclick="deleteIdea('${idea.id}')" class="text-gray-300 hover:text-red-500 transition-colors p-1 opacity-0 group-hover:opacity-100" title="Delete idea">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            ` : ''}
                        </div>
                        
                        <p class="text-gray-600 text-sm mb-4 pl-3 whitespace-pre-wrap leading-relaxed">${idea.description}</p>
                        
                        <div class="flex flex-wrap items-center gap-3 pl-3 text-xs">
                            <div class="flex items-center gap-1 bg-gray-50 text-gray-500 px-2 py-1 rounded-md border border-gray-100">
                                <i data-lucide="user" class="w-3 h-3"></i> 
                                <span class="font-medium">${idea.authorName}</span>
                            </div>
                            
                            ${formattedDate ? `
                            <div class="flex items-center gap-1 ${colorClass} text-romantic-700 px-2 py-1 rounded-md border border-romantic-100">
                                <i data-lucide="calendar-heart" class="w-3 h-3"></i> 
                                ${formattedDate}
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }
    </script>
</body>
</html>
